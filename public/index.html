<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuran'a Sor</title>
<script>
  // Stil ve gece modu ilk boyamadan önce uygulanır ki sayfa bir an yanlış renkte parlamasın
  (function () {
    var t = null, s = null;
    try { t = localStorage.getItem('kuranasor_tema'); s = localStorage.getItem('kuranasor_stil'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('data-stil', s === 'cini' ? 'cini' : 'cilt');
  })();
</script>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
  <a class="logo" href="/" data-link><span class="mark">KS</span><span class="brand">Kuran'a Sor</span></a>
  <div class="links">
    <a href="/" data-link>Sureler</a>
    <a href="/kesfet" data-link>Ağ</a>
    <a href="/hakkinda" data-link>Hakkında</a>
  </div>
  <div class="nav-tools">
    <select id="lang" title="İçerik dili" aria-label="İçerik dili">
      <option value="tr">TR</option>
      <option value="az">AZ</option>
      <option value="en">EN</option>
      <option value="de">DE</option>
    </select>
    <select id="stilSel" title="Görünüm stili" aria-label="Görünüm stili">
      <option value="cilt">Cilt</option>
      <option value="cini">Çini</option>
    </select>
    <button type="button" id="themeBtn" class="theme-btn" aria-pressed="false">Gece</button>
  </div>
</nav>
<div id="trail" hidden></div>
<main id="app"><div class="loading">Yükleniyor…</div></main>
<script src="/app.js"></script>
</body>
</html>
